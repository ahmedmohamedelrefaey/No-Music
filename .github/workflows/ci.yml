name: CI
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile backend/app/main.py backend/app/routers/separate.py backend/app/services/demucs_service.py backend/app/services/ffmpeg_service.py
      # Unit tests need FastAPI but do not need the large Demucs/Torch runtime.
      # The production dependency set is validated by the Docker build below.
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest backend/tests -q
        env:
          OUTPUTS_DIR: /tmp/mutemusic-ci-outputs
      - run: docker build -t mutemusic-backend ./backend
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
      - working-directory: mobile_app
        run: flutter pub get
      - working-directory: mobile_app
        run: flutter gen-l10n
      - working-directory: mobile_app
        run: flutter analyze

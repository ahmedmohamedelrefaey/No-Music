name: mutemusic_ai
description: Voice isolation for audio and video.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  file_picker: ^10.2.0
  ffmpeg_kit_flutter_new: ^4.6.2
  lottie: ^3.2.0
  audio_waveforms: ^1.1.0
  just_audio: ^0.9.42
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  purchases_flutter: ^8.6.0
  firebase_core: ^3.10.0
  firebase_analytics: ^11.3.6
  firebase_crashlytics: ^4.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icons/
    - assets/images/
